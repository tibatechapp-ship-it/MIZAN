name: MIZAN CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Compile
        run: python -m compileall -q src tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

  package:
    name: Wheel build & installed-CLI smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Install wheel into a clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl

      - name: Smoke the installed CLI
        run: |
          /tmp/smoke/bin/mizan --version
          /tmp/smoke/bin/mizan --help > /dev/null
          mkdir -p /tmp/smoke_fixture
          printf 'API_TOKEN = "sk-live-a1b2c3d4e5f6g7h8"\n' > /tmp/smoke_fixture/app.py
          # The gate must fire on the planted secret (exit 1). Exit 0 = rule
          # miss, exit 2 = incomplete — both fail the smoke.
          if /tmp/smoke/bin/mizan scan /tmp/smoke_fixture --gate critical,high; then
            echo "SMOKE FAILED: secret rule did not fire"; exit 1
          elif [ $? -ne 1 ]; then
            echo "SMOKE FAILED: gate did not return the findings exit code 1"; exit 1
          fi
          echo "SMOKE OK: wheel-installed CLI fired the rule and honored the gate"
