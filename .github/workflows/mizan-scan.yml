name: MIZAN Automated Scan

on:
  pull_request_target:
    branches: [ "main" ]

permissions:
  contents: write # ضروري للسماح لـ MIZAN برفع التعديلات
  pull-requests: write
  security-events: write

jobs:
  mizan-security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          pip install bandit semgrep
          npm install eslint

      # الخطوة الجديدة: الإصلاح التلقائي
      - name: Auto-Fix with ESLint
        run: |
          npx eslint . --fix || true
          git config --global user.name "MIZAN Bot"
          git config --global user.email "mizan-bot@users.noreply.github.com"
          git add .
          git commit -m "🤖 Auto-fix: MIZAN applied automatic code fixes [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.event.pull_request.head.ref }} || echo "Nothing to push"

      - name: Run MIZAN Scan
        id: mizan_scan
        continue-on-error: true
        run: python run_mizan.py

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: |
            bandit.sarif
            semgrep.sarif

      - name: Comment on PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body-file mizan_report.md

      - name: Fail if MIZAN found issues
        if: steps.mizan_scan.outcome == 'failure'
        run: exit 1
