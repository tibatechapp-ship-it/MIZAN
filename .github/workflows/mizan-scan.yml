name: MIZAN Automated Scan

on:
  pull_request_target:
    branches: [ "main" ]

permissions:
  contents: write
  pull-requests: write
  security-events: write

jobs:
  mizan-security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          pip install bandit semgrep
          npm install eslint

      - name: Run MIZAN Scan
        id: mizan_scan
        continue-on-error: true
        run: python run_mizan.py

      - name: AI Auto-Fix
        run: python src/mizan/ai_fixer.py

      - name: Commit and Push Fixes
        run: |
          git config --global user.name "MIZAN AI Bot"
          git config --global user.email "mizan-ai@users.noreply.github.com"
          git add .
          git commit -m "🧠 AI Auto-fix: MIZAN repaired security vulnerabilities [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.event.pull_request.head.ref }} || echo "Nothing to push"

      - name: Ensure SARIF files exist
        run: |
          if [ ! -f bandit.sarif ]; then echo '{"version": "2.1.0", "runs": []}' > bandit.sarif; fi
          if [ ! -f semgrep.sarif ]; then echo '{"version": "2.1.0", "runs": []}' > semgrep.sarif; fi

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: |
            bandit.sarif
            semgrep.sarif

      - name: Comment on PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body-file mizan_report.md

      - name: Fail if MIZAN found issues
        if: steps.mizan_scan.outcome == 'failure'
        run: exit 1
