name: MIZAN Automated Scan

on:
  pull_request:
    branches: [ "main" ]

# الصلاحيات المطلوبة لكي يتمكن MIZAN من كتابة تعليق
permissions:
  contents: read
  pull-requests: write

jobs:
  mizan-security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          pip install bandit
          npm install eslint

      - name: Run MIZAN Scan
        id: mizan_scan
        continue-on-error: true # نسمح للخطوة بالفشل لكي نستطيع قراءة التقرير
        run: python run_mizan.py

      - name: Comment on PR
        if: always() # قم بنشر التعليق دائماً (سواء نجح الفحص أو فشل)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body-file mizan_report.md

      - name: Fail if MIZAN found issues
        if: steps.mizan_scan.outcome == 'failure'
        run: exit 1
