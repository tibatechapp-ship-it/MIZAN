name: MIZAN Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'  # Every Monday at 02:00 UTC
  workflow_dispatch:

# SECURITY FIX: was `contents: write` + `pull-requests: write` at top level.
# The scan only needs to read code and (via the composite action) upload SARIF.
# If auto-fix/create-pr are ever enabled, grant `contents: write` to the JOB
# only — never at top level — and only on trusted (push) context.
permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: MIZAN Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run MIZAN
        uses: ./action
        with:
          path: '.'
          auto-fix: 'false'
          create-pr: 'false'
          fail-on-findings: 'true'
