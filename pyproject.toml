[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mizan-engine"
version = "0.2.0"
description = "AI-powered software analysis and verification engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]
license = "MIT"
authors = [{name = "MIZAN Contributors"}]

[project.scripts]
mizan = "mizan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
# Self-test extra used to demonstrate MIZAN's ability to scan and fix
# its own dependencies. Originally pinned to requests==2.0.0 (13 vulns);
# MIZAN detected and upgraded to 2.33.0 via `mizan fix --apply`.
self-test = ["requests==2.33.0"]
