[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mizan-engine"
version = "0.2.0"
description = "AI-powered software analysis and verification engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]
license = "MIT"
authors = [{name = "MIZAN Contributors"}]

[project.scripts]
mizan = "mizan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
