[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mizan-engine"
description = "MIZAN Security — one lightweight, fast engine for code, secrets, dependencies and CI hardening"
readme = "README.md"
requires-python = ">=3.10"
# SEC-06: version is derived from src/mizan/_version.py — single source of truth.
dynamic = ["version"]
dependencies = [
    "PyYAML>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]
license = "MIT"
authors = [{name = "MIZAN Security Contributors"}]

[tool.setuptools.dynamic]
version = {attr = "mizan._version.__version__"}

[project.scripts]
mizan = "mizan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Bait traps (tests/fixtures/bait/*.py) are inert demo files that read from
# stdin — they must NEVER be collected by pytest or unittest.
testpaths = ["tests"]
norecursedirs = ["fixtures", ".*", "build", "dist", "node_modules", "venv"]

[project.optional-dependencies]
# Self-test extra used to demonstrate MIZAN's ability to scan and fix
# its own dependencies. Originally pinned to requests==2.0.0 (13 vulns);
# MIZAN detected and upgraded to 2.33.0 via `mizan fix --apply`.
self-test = ["requests==2.33.0"]
