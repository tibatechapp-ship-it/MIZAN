name: 'MIZAN Vulnerability Scan'
description: 'Scan dependencies for vulnerabilities, upload SARIF, and optionally auto-fix'
author: 'tibatechapp-ship-it'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: 'Repository path to scan'
    required: false
    default: '.'
  auto-fix:
    description: 'Apply safe dependency upgrades (requires passing tests)'
    required: false
    default: 'false'
  create-pr:
    description: 'Create a PR with the fixes (implies auto-fix: true)'
    required: false
    default: 'false'
  fail-on-findings:
    description: 'Fail the workflow if any vulnerabilities are found'
    required: false
    default: 'true'
  sarif-output:
    description: 'Path to write the SARIF report'
    required: false
    default: 'mizan-results.sarif'
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.11'

outputs:
  findings-count:
    description: 'Number of vulnerabilities found'
    value: ${{ steps.scan.outputs.findings-count }}
  sarif-file:
    description: 'Absolute path to the SARIF file'
    value: ${{ steps.scan.outputs.sarif-file }}

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install MIZAN
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -e "${{ github.action_path }}/.."

    - name: Run MIZAN vuln-scan
      id: scan
      shell: bash
      run: |
        SARIF_PATH="$(pwd)/${{ inputs.sarif-output }}"
        mizan vuln-scan "${{ inputs.path }}" --format sarif -o "$SARIF_PATH" || true
        if [ -f "$SARIF_PATH" ]; then
          COUNT=$(python -c "import json; d=json.load(open('$SARIF_PATH')); print(len(d['runs'][0]['results']))")
        else
          COUNT=0
        fi
        echo "findings-count=$COUNT" >> "$GITHUB_OUTPUT"
        echo "sarif-file=$SARIF_PATH" >> "$GITHUB_OUTPUT"
        echo "::notice::MIZAN found $COUNT vulnerabilities"

    - name: Upload SARIF to GitHub Code Scanning
      if: always() && hashFiles(inputs.sarif-output) != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-output }}
        category: mizan

    - name: Apply fixes (local only)
      if: inputs.auto-fix == 'true' && steps.scan.outputs.findings-count != '0'
      shell: bash
      run: |
        echo "::group::MIZAN fix --apply"
        mizan fix "${{ inputs.path }}" --apply || echo "::warning::MIZAN fix encountered an issue"
        echo "::endgroup::"
        git diff --stat || true

    - name: Create Pull Request with fixes
      if: inputs.create-pr == 'true' && steps.scan.outputs.findings-count != '0'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ -z "$(git status --porcelain)" ]; then
          echo "::notice::No file changes to commit"
          exit 0
        fi
        BRANCH="mizan/auto-fix-$(date +%Y%m%d-%H%M%S)"
        git config user.name "MIZAN Bot"
        git config user.email "mizan-bot@users.noreply.github.com"
        git checkout -b "$BRANCH"
        git add -A
        git reset -- '*.sarif' 2>/dev/null || true
        if [ -z "$(git diff --cached --name-only)" ]; then
          echo "::notice::No committable changes after excluding SARIF"
          exit 0
        fi
        git commit -m "fix(deps): auto-fix ${{ steps.scan.outputs.findings-count }} vulnerabilities via MIZAN"
        git push -u origin "$BRANCH"
        BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
        [ -z "$BASE_BRANCH" ] && BASE_BRANCH="${{ github.event.repository.default_branch }}"
        [ -z "$BASE_BRANCH" ] && BASE_BRANCH="main"
        echo "Base branch: $BASE_BRANCH"
        PR_URL=$(gh pr create \
          --title "fix(deps): MIZAN auto-fix (${{ steps.scan.outputs.findings-count }} vulnerabilities)" \
          --body "MIZAN detected ${{ steps.scan.outputs.findings-count }} dependency vulnerabilities and applied safe fixes. See the Security tab for the full SARIF report." \
          --base "$BASE_BRANCH" \
          --head "$BRANCH" 2>&1) || {
            echo "::warning::gh pr create failed: $PR_URL"
            exit 0
          }
        echo "::notice::Created PR: $PR_URL"
        for L in mizan security dependencies; do
          gh pr edit "$PR_URL" --add-label "$L" 2>/dev/null || true
        done

    - name: Fail on findings
      if: inputs.fail-on-findings == 'true' && steps.scan.outputs.findings-count != '0'
      shell: bash
      run: |
        echo "::error::MIZAN found ${{ steps.scan.outputs.findings-count }} vulnerabilities. See the Security tab for details."
        exit 1
