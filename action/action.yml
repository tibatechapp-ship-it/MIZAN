name: 'MIZAN Vulnerability Scan'
description: 'Scan dependencies for vulnerabilities, upload SARIF, and optionally auto-fix'
author: 'tibatechapp-ship-it'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: 'Repository path to scan'
    required: false
    default: '.'
  auto-fix:
    description: 'Apply safe dependency upgrades (requires passing tests)'
    required: false
    default: 'false'
  create-pr:
    description: 'Create a PR with the fixes (implies auto-fix: true)'
    required: false
    default: 'false'
  fail-on-findings:
    description: 'Fail the workflow if any vulnerabilities are found'
    required: false
    default: 'true'
  sarif-output:
    description: 'Path to write the SARIF report'
    required: false
    default: 'mizan-results.sarif'
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.15'

  # F-01 (2026-11-26 live audit): the four auto-approve/auto-merge
  # inputs and their workflow step are DELETED — "final merge is human"
  # is the project's stated policy, and the auto-approve capability
  # contradicted it. There is no replacement input by design; the guard
  # test (tests/test_no_merge_capability.py) keeps this surface clean.
  fail-on-fix-error:
    description: 'Fail the workflow when mizan fix errors (default: false, but the failure is ALWAYS surfaced as an ::error and the fix-status output reports it — it is never silently swallowed)'
    required: false
    default: 'false'
  fail-on-pr-error:
    description: 'Fail the workflow when creating the fix PR errors (default: false, but the failure is ALWAYS surfaced as an ::error and the pr-status output reports it — it is never silently swallowed)'
    required: false
    default: 'false'

outputs:
  findings-count:
    description: 'Number of vulnerabilities found'
    value: ${{ steps.scan.outputs.findings-count }}
  sarif-file:
    description: 'Absolute path to the SARIF file'
    value: ${{ steps.scan.outputs.sarif-file }}
  fix-status:
    description: 'Outcome of the fix step: skipped | no-changes | applied | failed'
    value: ${{ steps.fix.outputs.fix-status }}
  pr-status:
    description: 'Outcome of the PR step: skipped | no-changes | created | failed'
    value: ${{ steps.pr.outputs.pr-status }}
  pr-url:
    description: 'URL of the created PR (empty when pr-status is not created)'
    value: ${{ steps.pr.outputs.pr-url }}

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (pinned)
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install MIZAN
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -e "${{ github.action_path }}/.."

    - name: Run MIZAN vuln-scan
      id: scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        SARIF_OUTPUT: ${{ inputs.sarif-output }}
      run: |
        SARIF_PATH="$(pwd)/$SARIF_OUTPUT"
        set +e
        mizan vuln-scan "$SCAN_PATH" --format sarif -o "$SARIF_PATH"
        RC=$?
        set -e
        # Exit-code contract (mizan scan / vuln-scan):
        #   0 = scan completed, no findings
        #   1 = scan completed, findings present
        #   >= 2 = scan FAILURE (bad path, OSV outage, ...)
        # RW-205: a scan failure or a missing/invalid report must NEVER be
        # reported as "0 vulnerabilities" — fail loudly instead.
        if [ "$RC" -ge 2 ]; then
          echo "::error::MIZAN vuln-scan FAILED (exit $RC). This is a scan failure, not 'no vulnerabilities'."
          exit 1
        fi
        if [ ! -f "$SARIF_PATH" ]; then
          echo "::error::MIZAN exited $RC but produced no SARIF report. Failing rather than reporting 0 findings."
          exit 1
        fi
        if ! python -c "import json,sys; d=json.load(open(sys.argv[1])); runs=d.get('runs'); assert isinstance(runs,list) and len(runs)>=1 and isinstance(runs[0].get('results'),list)" "$SARIF_PATH"; then
          echo "::error::SARIF report is malformed — refusing to treat it as a clean scan."
          exit 1
        fi
        COUNT=$(python -c "import json,sys; print(len(json.load(open(sys.argv[1]))['runs'][0]['results']))" "$SARIF_PATH")
        echo "findings-count=$COUNT" >> "$GITHUB_OUTPUT"
        echo "sarif-file=$SARIF_PATH" >> "$GITHUB_OUTPUT"
        echo "::notice::MIZAN scan completed (exit $RC): $COUNT vulnerabilities"

    - name: Upload SARIF to GitHub Code Scanning
      if: always() && hashFiles(inputs.sarif-output) != ''
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4 (pinned; bumped from v3)
      with:
        sarif_file: ${{ inputs.sarif-output }}
        category: mizan

    # E-01 (2026-11-17 review): a failed fix is NEVER silently swallowed.
    # The failure is always surfaced as an ::error and reported through the
    # fix-status output; fail-on-fix-error decides whether it also breaks
    # the workflow. No default path reports success without saying what
    # actually happened.
    - name: Apply fixes (local only)
      id: fix
      if: inputs.auto-fix == 'true' && steps.scan.outputs.findings-count != '0'
      shell: bash
      env:
        FIX_PATH: ${{ inputs.path }}
        FAIL_ON_FIX_ERROR: ${{ inputs.fail-on-fix-error }}
      run: |
        echo "::group::MIZAN fix --apply"
        set +e
        mizan fix "$FIX_PATH" --apply
        RC=$?
        set -e
        echo "::endgroup::"
        git diff --stat || true
        if [ "$RC" -ne 0 ]; then
          echo "fix-status=failed" >> "$GITHUB_OUTPUT"
          echo "::error::MIZAN fix FAILED (exit $RC) — the fix was NOT applied reliably. fix-status=failed"
          [ "$FAIL_ON_FIX_ERROR" = "true" ] && exit 1
          exit 0
        fi
        if [ -z "$(git status --porcelain)" ]; then
          echo "fix-status=no-changes" >> "$GITHUB_OUTPUT"
          echo "::notice::MIZAN fix completed without file changes"
        else
          echo "fix-status=applied" >> "$GITHUB_OUTPUT"
        fi

    # E-01 (2026-11-17 review): a failed PR creation is NEVER silently
    # converted into success. pr-status reports created | failed | skipped
    # | no-changes, failures emit ::error, and fail-on-pr-error decides
    # whether the workflow also fails. Downstream steps can gate on
    # pr-status instead of guessing.
    - name: Create Pull Request with fixes
      id: pr
      if: inputs.create-pr == 'true' && steps.scan.outputs.findings-count != '0'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_FINDINGS: ${{ steps.scan.outputs.findings-count }}
        FAIL_ON_PR_ERROR: ${{ inputs.fail-on-pr-error }}
        EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        REPO_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        fail_pr() {
          echo "pr-status=failed" >> "$GITHUB_OUTPUT"
          echo "::error::MIZAN fix-PR step FAILED: $1 — pr-status=failed, no PR was created"
          [ "$FAIL_ON_PR_ERROR" = "true" ] && exit 1
          exit 0
        }
        if [ -z "$(git status --porcelain)" ]; then
          echo "pr-status=no-changes" >> "$GITHUB_OUTPUT"
          echo "::notice::No file changes to commit"
          exit 0
        fi
        BRANCH="mizan/auto-fix-$(date +%Y%m%d-%H%M%S)"
        git config user.name "MIZAN Bot"
        git config user.email "mizan-bot@users.noreply.github.com"
        git checkout -b "$BRANCH" || fail_pr "could not create branch $BRANCH"
        git add -A
        git reset -- '*.sarif' 2>/dev/null || true
        if [ -z "$(git diff --cached --name-only)" ]; then
          echo "pr-status=no-changes" >> "$GITHUB_OUTPUT"
          echo "::notice::No committable changes after excluding SARIF"
          exit 0
        fi
        git commit -m "fix(deps): auto-fix $PR_FINDINGS vulnerabilities via MIZAN" || fail_pr "git commit failed"
        git push -u origin "$BRANCH" || fail_pr "git push failed"
        BASE_BRANCH="$EVENT_BASE_REF"
        [ -z "$BASE_BRANCH" ] && BASE_BRANCH="$REPO_DEFAULT_BRANCH"
        [ -z "$BASE_BRANCH" ] && BASE_BRANCH="main"
        echo "Base branch: $BASE_BRANCH"
        PR_URL=$(gh pr create \
          --title "fix(deps): MIZAN auto-fix ($PR_FINDINGS vulnerabilities)" \
          --body "MIZAN detected $PR_FINDINGS dependency vulnerabilities and applied safe fixes. See the Security tab for the full SARIF report." \
          --base "$BASE_BRANCH" \
          --head "$BRANCH" 2>&1) || fail_pr "gh pr create failed: $PR_URL"
        echo "pr-status=created" >> "$GITHUB_OUTPUT"
        echo "pr-url=$PR_URL" >> "$GITHUB_OUTPUT"
        echo "::notice::Created PR: $PR_URL"
        for L in mizan security dependencies; do
          gh pr edit "$PR_URL" --add-label "$L" 2>/dev/null || true
        done

    # F-01 (2026-11-26 live audit): the former "Auto-approve and merge
    # (safe)" step (RW-206) is deleted together with its inputs. The
    # merge decision always belongs to a human; the guard test keeps
    # every executable surface free of the gh review/merge subcommands.

    - name: Fail on findings
      if: inputs.fail-on-findings == 'true' && steps.scan.outputs.findings-count != '0'
      shell: bash
      run: |
        echo "::error::MIZAN found ${{ steps.scan.outputs.findings-count }} vulnerabilities. See the Security tab for details."
        exit 1
