name: 'MIZAN Vulnerability Scan'
description: 'Scan dependencies for vulnerabilities, upload SARIF, and optionally auto-fix'
author: 'tibatechapp-ship-it'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: 'Repository path to scan'
    required: false
    default: '.'
  auto-fix:
    description: 'Apply safe dependency upgrades (requires passing tests)'
    required: false
    default: 'false'
  create-pr:
    description: 'Create a PR with the fixes (implies auto-fix: true)'
    required: false
    default: 'false'
  fail-on-findings:
    description: 'Fail the workflow if any vulnerabilities are found'
    required: false
    default: 'true'
  sarif-output:
    description: 'Path to write the SARIF report'
    required: false
    default: 'mizan-results.sarif'
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.11'

  approve-prs:
    description: 'Auto-approve eligible PRs (off by default; requires care)'
    required: false
    default: 'false'
  merge-prs:
    description: 'Auto-merge PRs after approval (implies approve-prs)'
    required: false
    default: 'false'
  approve-exclude-paths:
    description: 'Comma-separated paths that block auto-approval'
    required: false
    default: '.github/,Dockerfile,.env,secrets/,k8s/,terraform/,helm/'
  approve-allowed-authors:
    description: 'Comma-separated bot authors allowed to be auto-approved'
    required: false
    default: 'dependabot[bot],renovate[bot],github-actions[bot]'

outputs:
  findings-count:
    description: 'Number of vulnerabilities found'
    value: ${{ steps.scan.outputs.findings-count }}
  sarif-file:
    description: 'Absolute path to the SARIF file'
    value: ${{ steps.scan.outputs.sarif-file }}

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5.6.0 (pinned)
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install MIZAN
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -e "${{ github.action_path }}/.."

    - name: Run MIZAN vuln-scan
      id: scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        SARIF_OUTPUT: ${{ inputs.sarif-output }}
      run: |
        SARIF_PATH="$(pwd)/$SARIF_OUTPUT"
        set +e
        mizan vuln-scan "$SCAN_PATH" --format sarif -o "$SARIF_PATH"
        RC=$?
        set -e
        # Exit-code contract (mizan scan / vuln-scan):
        #   0 = scan completed, no findings
        #   1 = scan completed, findings present
        #   >= 2 = scan FAILURE (bad path, OSV outage, ...)
        # RW-205: a scan failure or a missing/invalid report must NEVER be
        # reported as "0 vulnerabilities" — fail loudly instead.
        if [ "$RC" -ge 2 ]; then
          echo "::error::MIZAN vuln-scan FAILED (exit $RC). This is a scan failure, not 'no vulnerabilities'."
          exit 1
        fi
        if [ ! -f "$SARIF_PATH" ]; then
          echo "::error::MIZAN exited $RC but produced no SARIF report. Failing rather than reporting 0 findings."
          exit 1
        fi
        if ! python -c "import json,sys; d=json.load(open(sys.argv[1])); runs=d.get('runs'); assert isinstance(runs,list) and len(runs)>=1 and isinstance(runs[0].get('results'),list)" "$SARIF_PATH"; then
          echo "::error::SARIF report is malformed — refusing to treat it as a clean scan."
          exit 1
        fi
        COUNT=$(python -c "import json,sys; print(len(json.load(open(sys.argv[1]))['runs'][0]['results']))" "$SARIF_PATH")
        echo "findings-count=$COUNT" >> "$GITHUB_OUTPUT"
        echo "sarif-file=$SARIF_PATH" >> "$GITHUB_OUTPUT"
        echo "::notice::MIZAN scan completed (exit $RC): $COUNT vulnerabilities"

    - name: Upload SARIF to GitHub Code Scanning
      if: always() && hashFiles(inputs.sarif-output) != ''
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4 (pinned; bumped from v3)
      with:
        sarif_file: ${{ inputs.sarif-output }}
        category: mizan

    - name: Apply fixes (local only)
      if: inputs.auto-fix == 'true' && steps.scan.outputs.findings-count != '0'
      shell: bash
      env:
        FIX_PATH: ${{ inputs.path }}
      run: |
        echo "::group::MIZAN fix --apply"
        mizan fix "$FIX_PATH" --apply || echo "::warning::MIZAN fix encountered an issue"
        echo "::endgroup::"
        git diff --stat || true

    - name: Create Pull Request with fixes
      if: inputs.create-pr == 'true' && steps.scan.outputs.findings-count != '0'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_FINDINGS: ${{ steps.scan.outputs.findings-count }}
        EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        REPO_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        if [ -z "$(git status --porcelain)" ]; then
          echo "::notice::No file changes to commit"
          exit 0
        fi
        BRANCH="mizan/auto-fix-$(date +%Y%m%d-%H%M%S)"
        git config user.name "MIZAN Bot"
        git config user.email "mizan-bot@users.noreply.github.com"
        git checkout -b "$BRANCH"
        git add -A
        git reset -- '*.sarif' 2>/dev/null || true
        if [ -z "$(git diff --cached --name-only)" ]; then
          echo "::notice::No committable changes after excluding SARIF"
          exit 0
        fi
        git commit -m "fix(deps): auto-fix $PR_FINDINGS vulnerabilities via MIZAN"
        git push -u origin "$BRANCH"
        BASE_BRANCH="$EVENT_BASE_REF"
        [ -z "$BASE_BRANCH" ] && BASE_BRANCH="$REPO_DEFAULT_BRANCH"
        [ -z "$BASE_BRANCH" ] && BASE_BRANCH="main"
        echo "Base branch: $BASE_BRANCH"
        PR_URL=$(gh pr create \
          --title "fix(deps): MIZAN auto-fix ($PR_FINDINGS vulnerabilities)" \
          --body "MIZAN detected $PR_FINDINGS dependency vulnerabilities and applied safe fixes. See the Security tab for the full SARIF report." \
          --base "$BASE_BRANCH" \
          --head "$BRANCH" 2>&1) || {
            echo "::warning::gh pr create failed: $PR_URL"
            exit 0
          }
        echo "::notice::Created PR: $PR_URL"
        for L in mizan security dependencies; do
          gh pr edit "$PR_URL" --add-label "$L" 2>/dev/null || true
        done

    - name: Auto-approve and merge (safe)
      if: |
        github.event_name == 'pull_request'
        && (inputs.approve-prs == 'true' || inputs.merge-prs == 'true')
        && inputs.create-pr != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        FINDINGS_COUNT: ${{ steps.scan.outputs.findings-count }}
        EXCLUDE_PATHS: ${{ inputs.approve-exclude-paths }}
        ALLOWED_AUTHORS: ${{ inputs.approve-allowed-authors }}
        APPROVE_PRS: ${{ inputs.approve-prs }}
        MERGE_PRS: ${{ inputs.merge-prs }}
      run: |
        # RW-206: NO eval, NO string-built commands. Every value arrives
        # through the environment and is passed as a literal argument via a
        # bash array — shell metacharacters in inputs can never execute.
        args=(approve
          --pr "$PR_NUMBER"
          --findings "$FINDINGS_COUNT"
          --exclude-paths "$EXCLUDE_PATHS"
          --allowed-authors "$ALLOWED_AUTHORS"
        )
        if [ "$APPROVE_PRS" = "true" ]; then args+=(--approve); fi
        if [ "$MERGE_PRS" = "true" ]; then args+=(--approve --merge); fi
        echo "Running: mizan ${args[*]}"
        mizan "${args[@]}"

    - name: Fail on findings
      if: inputs.fail-on-findings == 'true' && steps.scan.outputs.findings-count != '0'
      shell: bash
      run: |
        echo "::error::MIZAN found ${{ steps.scan.outputs.findings-count }} vulnerabilities. See the Security tab for details."
        exit 1
